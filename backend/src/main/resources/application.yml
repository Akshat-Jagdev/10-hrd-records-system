spring:
  application:
    name: hrd-records
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrd}
    username: ${DB_USER:hrd}
    password: ${DB_PASSWORD:hrd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  jwt:
    # HS256 secret, must be at least 32 bytes. Override in production via env var.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.hrd.records: INFO
